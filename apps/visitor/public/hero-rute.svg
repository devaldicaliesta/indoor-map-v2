<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="t d">
  <title id="t">PanduArah: rute animasi di dalam gedung</title>
  <desc id="d">Denah sederhana dua lantai. Titik "Anda di sini" berdenyut di lobi, garis rute tergambar menuju lift, lalu berlanjut di lantai atas sampai ke tujuan Radiologi.</desc>
  <style>
    .room { fill: #f4efe6; stroke: #cfc6b5; stroke-width: 1.5; }
    .room-hi { fill: #fde9a8; stroke: #e0b43a; stroke-width: 1.5; }
    .hall { fill: #ffffff; stroke: #e2ddd3; stroke-width: 1; }
    .lbl { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #3b3f46; }
    .small { font: 500 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #7a7f87; }
    .floor { font: 800 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
    .route { fill: none; stroke: #1b7f6b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .route-a { stroke-dasharray: 360; stroke-dashoffset: 360; animation: draw-a 6s ease-in-out infinite; }
    .route-b { stroke-dasharray: 330; stroke-dashoffset: 330; animation: draw-b 6s ease-in-out infinite; }
    @keyframes draw-a { 0% { stroke-dashoffset: 360; } 35% { stroke-dashoffset: 0; } 90% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes draw-b { 0%, 45% { stroke-dashoffset: 330; } 80% { stroke-dashoffset: 0; } 90% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    .pulse { animation: pulse 1.6s ease-out infinite; transform-origin: 95px 230px; }
    @keyframes pulse { 0% { transform: scale(0.6); opacity: 0.7; } 100% { transform: scale(2.4); opacity: 0; } }
    .pin { animation: bounce 6s ease-in-out infinite; transform-origin: 790px 92px; }
    @keyframes bounce { 0%, 78% { transform: translateY(-14px); opacity: 0; } 84% { transform: translateY(0); opacity: 1; } 88% { transform: translateY(-6px); } 92%, 100% { transform: translateY(0); opacity: 1; } }
    .lift-glow { animation: lift 6s ease-in-out infinite; }
    @keyframes lift { 0%, 33% { fill: #e9edf3; } 38%, 46% { fill: #9fd8c9; } 52%, 100% { fill: #e9edf3; } }
    .toast { animation: toast 6s ease-in-out infinite; }
    @keyframes toast { 0%, 34% { opacity: 0; } 38%, 48% { opacity: 1; } 52%, 100% { opacity: 0; } }
    .done { animation: done 6s ease-in-out infinite; }
    @keyframes done { 0%, 82% { opacity: 0; } 86%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .route-a, .route-b { animation: none; stroke-dashoffset: 0; }
      .pulse, .pin, .lift-glow, .toast, .done { animation: none; }
      .pin, .done { opacity: 1; }
    }
  </style>

  <rect x="0" y="0" width="900" height="320" rx="18" fill="#faf8f3"/>

  <text x="40" y="58" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#2b2f36">Pandu<tspan fill="#e0a21a">Arah</tspan></text>
  <text x="40" y="84" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#5c616a">Pindai QR · cari tujuan · ikuti rute</text>

  <!-- Lantai GF -->
  <g>
    <rect x="30" y="160" width="400" height="130" rx="10" fill="#efe9de"/>
    <rect x="30" y="160" width="46" height="24" rx="6" fill="#2b2f36"/>
    <text class="floor" x="41" y="177">GF</text>
    <rect class="room" x="45" y="195" width="100" height="80" rx="4"/>
    <text class="lbl" x="70" y="214">Lobi</text>
    <rect class="hall" x="150" y="222" width="220" height="22"/>
    <rect class="room" x="160" y="250" width="70" height="30" rx="4"/>
    <text class="small" x="170" y="270">Apotek</text>
    <rect class="room" x="240" y="250" width="70" height="30" rx="4"/>
    <text class="small" x="246" y="270">Pendaftaran</text>
    <rect class="room" x="160" y="190" width="150" height="28" rx="4"/>
    <text class="small" x="200" y="209">Poli Umum</text>
    <rect class="lift-glow" x="375" y="200" width="45" height="66" rx="6" fill="#e9edf3" stroke="#aeb7c4"/>
    <text class="small" x="386" y="216">Lift</text>
  </g>

  <!-- Lantai L1 -->
  <g>
    <rect x="470" y="30" width="400" height="130" rx="10" fill="#efe9de"/>
    <rect x="470" y="30" width="46" height="24" rx="6" fill="#2b2f36"/>
    <text class="floor" x="483" y="47">L1</text>
    <rect x="485" y="70" width="45" height="66" rx="6" fill="#e9edf3" stroke="#aeb7c4"/>
    <text class="small" x="494" y="108">Lift</text>
    <rect class="hall" x="535" y="92" width="200" height="22"/>
    <rect class="room" x="545" y="62" width="85" height="26" rx="4"/>
    <text class="small" x="556" y="80">Laboratorium</text>
    <rect class="room" x="640" y="62" width="85" height="26" rx="4"/>
    <text class="small" x="664" y="80">Farmasi</text>
    <rect class="room" x="545" y="120" width="180" height="28" rx="4"/>
    <text class="small" x="608" y="139">Ruang Tunggu</text>
    <rect class="room-hi" x="740" y="62" width="115" height="86" rx="4"/>
    <text class="lbl" x="760" y="138">Radiologi</text>
  </g>

  <!-- Penghubung antar lantai -->
  <path d="M398 200 C 398 150, 508 190, 508 136" fill="none" stroke="#aeb7c4" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- Rute -->
  <path class="route route-a" d="M95 233 L 150 233 L 370 233 L 397 233"/>
  <path class="route route-b" d="M530 103 L 735 103 L 790 103 L 790 100"/>

  <!-- Anda di sini -->
  <circle class="pulse" cx="95" cy="230" r="10" fill="#2f6fde"/>
  <circle cx="95" cy="230" r="8" fill="#2f6fde" stroke="#ffffff" stroke-width="3"/>
  <g transform="translate(40 120)">
    <rect width="112" height="26" rx="13" fill="#2f6fde"/>
    <text x="14" y="18" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#ffffff">📍 Anda di sini</text>
  </g>
  <path d="M95 146 L 95 218" stroke="#2f6fde" stroke-width="1.5" stroke-dasharray="3 4"/>

  <!-- Toast lift -->
  <g class="toast" transform="translate(300 60)">
    <rect width="140" height="30" rx="15" fill="#1b7f6b"/>
    <text x="16" y="20" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#ffffff">⬆ Naik lift ke L1</text>
  </g>

  <!-- Tujuan -->
  <g class="pin">
    <path d="M790 92 c -12 -14 -16 -22 -16 -30 a 16 16 0 0 1 32 0 c 0 8 -4 16 -16 30 z" fill="#d94841" stroke="#ffffff" stroke-width="2"/>
    <circle cx="790" cy="62" r="6" fill="#ffffff"/>
  </g>
  <g class="done" transform="translate(680 190)">
    <rect width="190" height="34" rx="17" fill="#2b2f36"/>
    <text x="18" y="22" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff">🎉 Tiba di Radiologi · 86 m</text>
  </g>
</svg>

# Versi aman untuk dependensi transitif workbox-build (vite-plugin-pwa), hanya dipakai saat build:
# glob < 14.0.2 (GHSA-3g3m-2fjr-6pw4) dan minimatch < 11.0.1 (DoS globparts).
overrides:
  'glob@>=9.0.0 <14.0.2': ^14.0.3
  'minimatch@<11.0.1': ^11.0.4
